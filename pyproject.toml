# Tool configuration for recon-monitor.
#
# Kept in pyproject.toml because black and isort read it natively. ruff and
# mypy use ruff.toml / mypy.ini, and flake8 uses .flake8 -- all four are held
# at a consistent 100-column limit so they cannot contradict each other.
#
# This file holds *tooling* configuration only. There is deliberately no
# [build-system] / [project] table: this is an application, not a distributable
# package, and declaring it as one would change how it is installed.

[tool.black]
line-length = 100
target-version = ["py312"]
# Do not reformat generated migrations: `makemigrations` regenerates them, so
# any manual formatting there would be silently reverted.
extend-exclude = '''
(
  /migrations/
  | /\.venv/
  | /venv/
  | /staticfiles/
  | /data/
)
'''
