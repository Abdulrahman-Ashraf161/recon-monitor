# Ruff configuration for recon-monitor.
#
# There was previously no tool configuration at all, so every linter ran on
# Django defaults and reported Django-idiomatic code as errors. The rules below
# are scoped to what is actually meaningful for this codebase, and every
# exclusion is justified rather than a blanket "make it quiet".
#
# Guiding rule: suppress a finding only when it is a *false positive* for Django
# or generated code, never to hide a real defect. The genuinely-actionable rules
# (F401 unused imports, F841 unused variables, F601 duplicate dict keys,
# B023 loop-variable capture, B017 blind except, RUF100 stale noqa) stay on and
# are enforced.

target-version = "py312"
line-length = 100
extend-exclude = [
    # Generated by makemigrations -- never hand-edited, and re-generating it
    # would silently revert any manual "fix" in these files.
    "**/migrations/*",
    ".venv",
    "venv",
    "staticfiles",
    "data",
]

[lint]
select = [
    "F",     # pyflakes: undefined/unused names, duplicate keys (F601)
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "B",     # bugbear: B023 loop capture, B017 blind except
    "C4",    # comprehensions
    "SIM",   # simplify
    "UP",    # pyupgrade
    "I",     # import sorting
    "RUF",   # ruff-specific
    "S",     # bandit security
    "G",     # logging format
]
ignore = [
    # E501 line length: the repo predates a linter and several long SQL/log
    # lines are unavoidable; ruff's formatter handles wrapping going forward.
    "E501",
    # B008: function call in default argument -- required by Django's
    # ForeignKey/related-field idiom (`ForeignKey(X, default=...)`).
    "B008",
    # S108: these are the tool-output/temp paths the recon tools already use
    # under DATA_DIR, not attacker-controlled.
    "SIM108",
    # RUF012: Django's declarative field defaults (`TextChoices` lists,
    # `default=list`, `choices = [...]`) are class attributes by design. Django
    # deep-copies them per instance, so a mutable class default is safe here.
    "RUF012",
    # S603: subprocess is invoked with an argument list and shell=False (the
    # default), which is the safe form. Verified in apps/monitoring/tasks.py.
    "S603",
    # S105/S106: false positives on settings-level SECRET_KEY env lookups and
    # on test fixture passwords. Scoped per-file below where possible.
    "S105",
    "S106",
    # SIM103: flags `if cond: return False ... return True` and wants a negated
    # boolean return. In the authorization/scannability guard chains
    # (Target.is_scannable, _cve_uptodate) the explicit "if this blocks, stop"
    # form is materially easier to audit, and each condition is checked against
    # a different rule. Rewriting them hides that structure.
    "SIM103",
    # S110/S112: try-except-pass / try-except-continue. These are the deliberate
    # shape of the orchestrator: one stage's failure must not abort the batch or
    # the sweep, and the failure is already counted and recorded (P1-003,
    # P1-006). Collapsing these to `pass` hides the intent that the failure was
    # handled rather than ignored.
    "S110",
    "S112",
    # SIM105: suggests contextlib.suppress. A try/except that does NOT pass --
    # it records, counts or returns a degraded result -- is the point, and
    # contextlib.suppress cannot express that.
    "SIM105",
    # S310: urlopen audit. All three sites are in the SSRF fetch layer and
    # already (a) validate the URL with _url_allowed_for_fetch and (b) open it
    # through _safe_opener, which re-validates every redirect hop. A bare
    # urlopen is what this rule is looking for, and none exists.
    "S310",
    # RUF001: the three hits are a literal "ℹ" emoji in Discord embed text.
    "RUF001",
]

[lint.per-file-ignores]
# Django migrations are generated; ruff must not propose edits to them.
"**/migrations/*.py" = ["ALL"]
# Test modules intentionally construct unused locals and import modules to
# assert importability, and use broad excepts in negative-path assertions.
# Test doubles also use mutable class attributes, which RUF012 would flag.
# S105/S106 are false positives: a fixture password in a test is not a secret.
# S607: tests shell out to `git ls-files` on purpose.
# S108: the export tests deliberately use a fixed /tmp path so the export
# realpath-containment check has a predictable, world-writable sibling to
# reject; a random tempdir would weaken the assertion.
"tests/*" = ["S101", "F841", "BLE001", "S110", "S112", "B017", "RUF059",
             "SIM117", "RUF012", "S105", "S106", "S607", "S108"]
# Django settings modules legitimately mutate module-level state, read
# SECRET_KEY from the environment with a development fallback (S105), and use
# the `from .base import *` settings idiom (F405).
"config/settings/*.py" = ["F401", "F403", "F405", "S105"]
# E741: the recon adapters use `l` for a single label/path segment to match the
# surrounding parsing expressions; renaming would reduce readability.
"services/tool_adapters/adapters.py" = ["E741"]
# `__init__.py` re-exports its public surface on purpose.
"__init__.py" = ["F401"]

[lint.flake8-bugbear]
# B023 is enforced: function-uses-loop-variable is a real bug class (a Celery
# task capturing `name` from an enclosing loop). See
# tests/test_manual_scan_orchestration.py, where the binding is explicit.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
