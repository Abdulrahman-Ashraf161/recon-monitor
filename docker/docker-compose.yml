# Production compose (Task 26). ALL secrets are required environment — there are
# no working defaults here, so `docker compose up` without a filled .env fails
# fast instead of booting DEBUG=True / POSTGRES_PASSWORD=recon.
#
#   cd docker && cp .env.docker.example .env   # fill in REAL secrets
#   docker compose up -d --build
#
# Dev loop: see docker-compose.override.yml.example (throwaway creds, separate file).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in docker/.env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in docker/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in docker/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in docker/.env}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?set ALLOWED_HOSTS in docker/.env}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in docker/.env}
      REDIS_URL: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "False"
      USE_REDIS_CHANNELS: "True"
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: celery -A config worker -l info
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in docker/.env}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?set ALLOWED_HOSTS in docker/.env}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in docker/.env}
      REDIS_URL: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "False"
    depends_on:
      - db
      - redis
  beat:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: celery -A config beat -l info
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in docker/.env}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?set ALLOWED_HOSTS in docker/.env}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in docker/.env}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis

volumes:
  pgdata:
