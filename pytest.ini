[pytest]
# The suite is a Django suite: it needs settings configured and a test database.
# `manage.py test` remains the canonical runner; this makes `pytest` work too
# (FINAL-003 asks for both).
DJANGO_SETTINGS_MODULE = config.settings
python_files = test_*.py
testpaths = tests
addopts = -q --tb=short
filterwarnings =
    ignore::DeprecationWarning
