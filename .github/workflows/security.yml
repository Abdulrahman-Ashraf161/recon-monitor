# Task 28: dependency vulnerability scan — fails on HIGH/CRITICAL.
name: security

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit -r requirements.lock.txt
